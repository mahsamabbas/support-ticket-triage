# Ollama runs on the host, not in Compose.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8005}:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.6}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005,http://127.0.0.1:3005}
    volumes:
      - queuewise-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health answers 200 even when Ollama is down, so the UI can start and show its banner.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle; the browser cannot resolve Docker service names.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8005}
    ports:
      - "${FRONTEND_PORT:-3005}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  queuewise-data:
